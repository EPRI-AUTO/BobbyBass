ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1

    # Coordinate frame IDs
    world_frame: odom
    base_link_frame: base_link
    odom_frame: odom
    two_d_mode: true

     IMU config
    imu0: unilidar/imu
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # GPS input is handled by navsat_transform_node
    odom0: odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
